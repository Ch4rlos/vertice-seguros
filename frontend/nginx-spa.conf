server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Assets con hash en el nombre: caché larga e inmutable (nunca cambian).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # HTML y rutas SPA: siempre revalidar contra el servidor (nunca servir
    # un index.html viejo de caché que apunte a bundles antiguos).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
