# Doble proxy (nginx host -> este nginx, 2026-08-28 el equipo). Si el cliente
# directo es loopback (solo el host nginx puede conectar aqui), confiar en
# sus headers YA LIMPIOS; si es remoto (exposicion directa), pisar con
# $remote_addr (fix OWASP A07 — el cliente no puede inyectar XFF).
map $remote_addr $cq_client_ip {
    ~^127\.  $http_x_forwarded_for;
    default  $remote_addr;
}
map $remote_addr $cq_client_proto {
    ~^127\.  $http_x_forwarded_proto;
    default  $scheme;
}

server {
    listen 80;
    server_name _;
    # Auditoria OWASP A02 (2026-08-26): no exponer la version de nginx.
    server_tokens off;

    # Capa 3 (directiva de Carlos 2026-08-24): headers anti-sniffing.
    # SAMEORIGIN: permite previews de /compartido en WhatsApp/redes sin
    # permitir clickjacking externo.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Auditoria OWASP A02 (2026-08-26): CSP first-party (mitigacion XSS).
    # style 'unsafe-inline' requerido por los estilos inline de React.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # API Django
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Fix OWASP A07 + doble proxy: $cq_client_ip = IP real del cliente
        # (pisada si viene directo; del host confiable si viene por loopback).
        proxy_set_header X-Forwarded-For $cq_client_ip;
        proxy_set_header X-Forwarded-Proto $cq_client_proto;
    }

    # Frontend React (SPA)
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
